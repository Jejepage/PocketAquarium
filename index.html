<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>PocketAquarium</title>
    <style>
      :root { background: #061b2e; color: #ecf8ff; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { align-items: center; display: grid; margin: 0; min-height: 100dvh; padding: clamp(0.75rem, 2vw, 1.5rem); }
      main { margin: auto; max-width: 1100px; position: relative; width: 100%; }
      canvas { background: linear-gradient(#0c6584 0%, #07344e 64%, #042338 100%); border: 2px solid #7ad4df; border-radius: 1.25rem; box-shadow: 0 1rem 3rem #0008; display: block; height: min(78dvh, 680px); min-height: 320px; touch-action: none; width: 100%; }
      .controls { bottom: 1rem; display: flex; justify-content: center; left: 1rem; pointer-events: none; position: absolute; right: 1rem; }
      button { background: #ffbf4f; border: 2px solid #fff3ca; border-radius: 999px; box-shadow: 0 .2rem .6rem #04233799; color: #132839; font: inherit; font-weight: 750; padding: .7rem 1.2rem; pointer-events: auto; }
      button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
      .notice { margin: .8rem 0 0; text-align: center; }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main aria-label="PocketAquarium">
      <canvas id="aquarium" aria-label="Animierte Aquariumansicht mit schwimmenden Fischen" role="img"></canvas>
      <div class="controls"><button id="feed" type="button">Füttern</button></div>
      <p id="notice" class="notice" hidden></p>
    </main>
    <script>
      (() => {
        const canvas = document.querySelector('#aquarium');
        const feedButton = document.querySelector('#feed');
        const notice = document.querySelector('#notice');
        const context = canvas.getContext?.('2d');
        const supportsPointerEvents = 'PointerEvent' in window;

        if (!context) {
          notice.hidden = false;
          notice.textContent = 'Dein Browser unterstützt die Aquariumansicht nicht.';
          return;
        }

        if (!supportsPointerEvents) {
          notice.hidden = false;
          notice.textContent = 'Dein Browser unterstützt die Szenengesten nicht. Füttern bleibt verfügbar.';
        }

        const MAX_FISH = 6;
        const GESTURE = { shortPressMs: 280, doublePressMs: 360, dragDistance: 18, doubleDistance: 42 };

        const state = {
          width: 0, height: 0, lastTime: 0,
          fish: [
            { x: .22, y: .31, speed: .075, size: 31, phase: 0.3, color: '#ffbf4f', accent: '#fff0b5', direction: 1, turn: 0.88, behavior: 'idle' },
            { x: .62, y: .55, speed: .048, size: 43, phase: 2.1, color: '#ef6b79', accent: '#ffd1bd', direction: -1, turn: 0.57, behavior: 'idle' },
            { x: .43, y: .72, speed: .1, size: 24, phase: 4.4, color: '#8bddbd', accent: '#d7ffe3', direction: 1, turn: 1.16, behavior: 'idle' }
          ],
          bubbles: Array.from({ length: 10 }, (_, i) => ({ x: .07 + ((i * 37) % 86) / 100, y: (i * 19 % 100) / 100, size: 3 + i % 4, speed: .025 + i % 3 * .008 })),
          particles: Array.from({ length: 34 }, (_, i) => ({ x: (i * 31 % 100) / 100, y: (i * 47 % 100) / 100, drift: .008 + i % 4 * .003, phase: i })),
          gesture: null, pendingTap: null, food: null
        };

        function clamp(value, minimum, maximum) { return Math.max(minimum, Math.min(maximum, value)); }

        function makeFish() {
          const palettes = [
            ['#8ea8ff', '#e0e9ff'], ['#f6a0d7', '#ffe1f4'], ['#ff9d65', '#ffe0c4'], ['#a5d86a', '#e0ffc8']
          ];
          const [color, accent] = palettes[Math.floor(Math.random() * palettes.length)];
          return {
            x: .12 + Math.random() * .76, y: .22 + Math.random() * .55,
            speed: .045 + Math.random() * .065, size: 25 + Math.random() * 17,
            phase: Math.random() * Math.PI * 2, color, accent,
            direction: Math.random() < .5 ? -1 : 1, turn: .65 + Math.random() * .7, behavior: 'idle'
          };
        }

        function setBehavior(fish, behavior, target, duration) {
          fish.behavior = behavior;
          fish.targetX = clamp(target.x, .08, .92);
          fish.targetY = clamp(target.y, .16, .8);
          fish.behaviorUntil = performance.now() + duration;
        }

        function showCuriosity(point) {
          state.fish.forEach(fish => setBehavior(fish, 'curious', point, 1450));
        }

        function fleeFrom(point) {
          const nearby = state.fish.filter(fish => Math.hypot(fish.x - point.x, fish.y - point.y) < .34);
          const affected = nearby.length ? nearby : [state.fish.reduce((closest, fish) => Math.hypot(fish.x - point.x, fish.y - point.y) < Math.hypot(closest.x - point.x, closest.y - point.y) ? fish : closest)];
          affected.forEach(fish => {
            const distance = Math.max(.01, Math.hypot(fish.x - point.x, fish.y - point.y));
            setBehavior(fish, 'fleeing', { x: fish.x + (fish.x - point.x) / distance * .3, y: fish.y + (fish.y - point.y) / distance * .24 }, 850);
          });
        }

        function addFish() {
          if (state.fish.length < MAX_FISH) state.fish.push(makeFish());
        }

        function feedFish() {
          if (state.food) return;
          const x = .35 + Math.random() * .3;
          state.food = {
            particles: Array.from({ length: 12 }, (_, index) => ({ x: x + (index % 4 - 1.5) * .018, y: .16 + Math.floor(index / 4) * .012, eaten: false })),
            eater: null, nextBiteAt: performance.now()
          };
          feedButton.disabled = true;
        }

        function foodTarget() {
          const visible = state.food.particles.filter(particle => !particle.eaten);
          return {
            x: visible.reduce((total, particle) => total + particle.x, 0) / visible.length,
            y: visible.reduce((total, particle) => total + particle.y, 0) / visible.length
          };
        }

        function resize() {
          clearInteraction();
          const rect = canvas.getBoundingClientRect();
          const scale = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.round(rect.width * scale);
          canvas.height = Math.round(rect.height * scale);
          context.setTransform(scale, 0, 0, scale, 0, 0);
          state.width = rect.width;
          state.height = rect.height;
        }

        function drawPlant(x, base, height, phase) {
          context.strokeStyle = '#237c65'; context.lineWidth = 8; context.lineCap = 'round';
          for (let leaf = -1; leaf <= 1; leaf++) {
            context.beginPath(); context.moveTo(x, base);
            context.quadraticCurveTo(x + leaf * 20 + Math.sin(phase) * 8, base - height * .55, x + leaf * 30 + Math.cos(phase * 1.3) * 10, base - height);
            context.stroke();
          }
        }

        function drawFish(fish, time) {
          const x = fish.x * state.width, y = fish.y * state.height;
          const wiggle = Math.sin(time * 4 * fish.speed + fish.phase) * 5;
          context.save(); context.translate(x, y + wiggle); context.scale(fish.direction, 1);
          context.fillStyle = fish.color;
          context.beginPath(); context.ellipse(0, 0, fish.size, fish.size * .55, 0, 0, Math.PI * 2); context.fill();
          context.beginPath(); context.moveTo(-fish.size * .75, 0); context.lineTo(-fish.size * 1.35, -fish.size * .55); context.lineTo(-fish.size * 1.25, fish.size * .55); context.closePath(); context.fill();
          context.fillStyle = fish.accent; context.beginPath(); context.arc(fish.size * .48, -fish.size * .16, Math.max(2, fish.size * .09), 0, Math.PI * 2); context.fill();
          context.fillStyle = '#102b3a'; context.beginPath(); context.arc(fish.size * .5, -fish.size * .17, Math.max(1.5, fish.size * .045), 0, Math.PI * 2); context.fill();
          context.restore();
        }

        function drawReaction(fish) {
          if (fish.behavior === 'idle') return;
          const x = fish.targetX * state.width, y = fish.targetY * state.height;
          context.save();
          context.strokeStyle = fish.behavior === 'curious' ? '#fff4a9cc' : fish.behavior === 'feeding' ? '#ffcf72' : '#d7f6ffbb';
          context.lineWidth = 2;
          context.setLineDash([5, 6]);
          context.beginPath(); context.arc(x, y, fish.behavior === 'curious' ? 16 : 12, 0, Math.PI * 2); context.stroke();
          context.restore();
        }

        function update(dt) {
          if (state.food) {
            for (const particle of state.food.particles) if (!particle.eaten) particle.y = Math.min(.76, particle.y + .055 * dt);
            const target = foodTarget();
            if (!state.food.eater) state.food.eater = state.fish.reduce((closest, fish) => Math.hypot(fish.x - target.x, fish.y - target.y) < Math.hypot(closest.x - target.x, closest.y - target.y) ? fish : closest);
            const eater = state.food.eater;
            const fleeing = eater.behavior === 'fleeing' && performance.now() < eater.behaviorUntil;
            if (!fleeing) {
              eater.behavior = 'feeding'; eater.targetX = target.x; eater.targetY = target.y;
              const dx = target.x - eater.x, dy = target.y - eater.y, distance = Math.hypot(dx, dy);
              if (distance > .012) {
                eater.x += dx / distance * Math.min(distance, .36 * dt);
                eater.y += dy / distance * Math.min(distance, .36 * dt);
                eater.direction = dx >= 0 ? 1 : -1;
              } else if (performance.now() >= state.food.nextBiteAt) {
                const bite = state.food.particles.find(particle => !particle.eaten);
                if (bite) { bite.eaten = true; state.food.nextBiteAt = performance.now() + 220; }
              }
            }
            if (state.food.particles.every(particle => particle.eaten)) {
              eater.behavior = 'idle'; state.food = null; feedButton.disabled = false;
            }
          }
          for (const fish of state.fish) {
            if (state.food && fish === state.food.eater && fish.behavior === 'feeding') continue;
            if (fish.behavior !== 'idle' && performance.now() < fish.behaviorUntil) {
              const dx = fish.targetX - fish.x, dy = fish.targetY - fish.y;
              const distance = Math.hypot(dx, dy);
              const reactionSpeed = fish.behavior === 'fleeing' ? .52 : .3;
              if (distance > .006) {
                fish.x += dx / distance * Math.min(distance, reactionSpeed * dt);
                fish.y += dy / distance * Math.min(distance, reactionSpeed * dt);
                fish.direction = dx >= 0 ? 1 : -1;
              }
            } else {
              fish.behavior = 'idle';
              fish.x += fish.direction * fish.speed * dt;
              fish.y += Math.sin(performance.now() * .001 * fish.turn + fish.phase) * .009 * dt;
            }
            if (fish.x > 1.12 || fish.x < -.12) { fish.direction *= -1; fish.x = Math.max(-.1, Math.min(1.1, fish.x)); }
            fish.y = Math.max(.16, Math.min(.8, fish.y));
          }
          for (const bubble of state.bubbles) { bubble.y -= bubble.speed * dt; if (bubble.y < -.04) { bubble.y = 1.04; bubble.x = .05 + Math.random() * .9; } }
          for (const particle of state.particles) { particle.y -= particle.drift * dt; if (particle.y < 0) particle.y = 1; }
        }

        function render(time) {
          const { width, height } = state;
          context.clearRect(0, 0, width, height);
          const seaFloor = context.createLinearGradient(0, height * .82, 0, height);
          seaFloor.addColorStop(0, '#b27d4d'); seaFloor.addColorStop(1, '#694128'); context.fillStyle = seaFloor; context.fillRect(0, height * .83, width, height * .17);
          context.fillStyle = '#d6f4f033';
          for (const particle of state.particles) context.fillRect(state.width * particle.x + Math.sin(time * .0008 + particle.phase) * 8, state.height * particle.y, 2, 2);
          for (const bubble of state.bubbles) { context.strokeStyle = '#d8ffffaa'; context.lineWidth = 1.5; context.beginPath(); context.arc(bubble.x * width, bubble.y * height, bubble.size, 0, Math.PI * 2); context.stroke(); }
          drawPlant(width * .12, height * .87, height * .28, time * .001); drawPlant(width * .86, height * .88, height * .34, time * .0012 + 2); drawPlant(width * .7, height * .9, height * .19, time * .0009 + 5);
          state.fish.forEach(drawReaction); state.fish.forEach(fish => drawFish(fish, time * .001));
          if (state.food) {
            for (const particle of state.food.particles) {
              if (particle.eaten) continue;
              context.fillStyle = '#f3c46b';
              context.beginPath(); context.arc(particle.x * width, particle.y * height, 4, 0, Math.PI * 2); context.fill();
              context.strokeStyle = '#fff0b6'; context.lineWidth = 1;
              context.beginPath(); context.arc(particle.x * width, particle.y * height, 4, 0, Math.PI * 2); context.stroke();
            }
          }
        }

        function frame(time) { const dt = Math.min((time - state.lastTime) / 1000 || 0, .05); state.lastTime = time; update(dt); render(time); requestAnimationFrame(frame); }
        function scenePoint(event) {
          const rect = canvas.getBoundingClientRect();
          return { x: clamp((event.clientX - rect.left) / rect.width, 0, 1), y: clamp((event.clientY - rect.top) / rect.height, 0, 1), clientX: event.clientX, clientY: event.clientY };
        }

        function clearPendingTap() {
          if (state.pendingTap) clearTimeout(state.pendingTap.timer);
          state.pendingTap = null;
        }

        function clearGesture() {
          if (state.gesture && canvas.hasPointerCapture?.(state.gesture.pointerId)) canvas.releasePointerCapture(state.gesture.pointerId);
          state.gesture = null;
        }

        function clearInteraction() {
          clearGesture();
          clearPendingTap();
        }

        function onPointerDown(event) {
          if (state.gesture) return;
          const point = scenePoint(event);
          state.gesture = { pointerId: event.pointerId, start: point, last: point, startedAt: performance.now(), dragging: false };
          canvas.setPointerCapture?.(event.pointerId);
        }
        function onPointerMove(event) {
          if (!state.gesture || event.pointerId !== state.gesture.pointerId) return;
          const point = scenePoint(event); const dx = point.clientX - state.gesture.start.clientX, dy = point.clientY - state.gesture.start.clientY;
          state.gesture.last = point;
          if (!state.gesture.dragging && Math.hypot(dx, dy) >= GESTURE.dragDistance) state.gesture.dragging = true;
          if (state.gesture.dragging) fleeFrom(point);
        }
        function onPointerUp(event) {
          if (!state.gesture || event.pointerId !== state.gesture.pointerId) return;
          const gesture = state.gesture; const point = scenePoint(event); clearGesture();
          const distance = Math.hypot(point.clientX - gesture.start.clientX, point.clientY - gesture.start.clientY);
          if (gesture.dragging || distance >= GESTURE.dragDistance || performance.now() - gesture.startedAt > GESTURE.shortPressMs) return;
          const pending = state.pendingTap;
          if (pending && performance.now() - pending.at <= GESTURE.doublePressMs && Math.hypot(point.clientX - pending.point.clientX, point.clientY - pending.point.clientY) <= GESTURE.doubleDistance) {
            clearTimeout(pending.timer); state.pendingTap = null; addFish(); return;
          }
          const pendingTap = { at: performance.now(), point, timer: 0 };
          pendingTap.timer = window.setTimeout(() => { if (state.pendingTap === pendingTap) { state.pendingTap = null; showCuriosity(point); } }, GESTURE.doublePressMs);
          state.pendingTap = pendingTap;
        }
        if (supportsPointerEvents) {
          canvas.addEventListener('pointerdown', onPointerDown);
          canvas.addEventListener('pointermove', onPointerMove);
          canvas.addEventListener('pointerup', onPointerUp);
          canvas.addEventListener('pointercancel', clearInteraction);
        }
        window.addEventListener('blur', clearInteraction);
        feedButton.addEventListener('click', feedFish);
        new ResizeObserver(resize).observe(canvas); resize(); requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
